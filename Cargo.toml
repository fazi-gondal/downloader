[package]
name = "downloader"
version = "0.1.0"
edition = "2024"
description = "High-performance desktop media downloader & transcoder built with GPUI-kit"
license = "MIT"
authors = ["Fazi Gondal"]

[dependencies]
gpui-kit = "0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
